# One-shot physical filter/channel pruning of YOLOv5s.
# 10% global selection is deliberately conservative because recovery is off.
model:
  name: yolov5
  weights: weights/yolov5s.pt
  device: cuda
  input_shape: [1, 3, 640, 640]

pruning:
  pruner: structured
  criterion: l1
  granularity: filter
  amount: 0.10
  # One dependency group: model.2.cv1.conv (validated in the initial global plan).
  # A global policy scatters 10% across 16 roots and is impractical on CPU.
  global_pruning: false
  layer_params: [[0, 0.10]]
  min_channels: 8

sensitivity:
  enabled: false

evaluation:
  enabled: true
  callback: experiments.yolov5:evaluate
  metric: map50_95
  kwargs:
    data: data/coco_500.yaml
    batch_size: 8
    imgsz: 640

recovery:
  enabled: false
  epochs: 0

benchmark:
  enabled: true
  latency: true
  # THOP tracing every YOLO dependency group is prohibitively slow on CPU.
  # Params and measured latency still provide the deployment comparison.
  flops: false
  params: true
  warmup: 10
  runs: 50

experiment:
  name: yolov5s_filter_channel_global_10
  output_dir: artifacts
  seed: 42
  deterministic: true

output_path: artifacts/yolov5s_filter_channel_global_10.pt
