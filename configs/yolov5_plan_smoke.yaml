# Safe planning smoke test: invoke with --build-plan-only.
model:
  name: yolov5
  weights: weights/yolov5s.pt
  device: cuda

pruning:
  method: structured
  criterion: l1
  structure: channel
  target_ratio: 0.10
  min_channels: 8

sensitivity:
  enabled: false

evaluation:
  enabled: false

recovery:
  enabled: false
  epochs: 0

benchmark:
  enabled: false
  latency: false
  flops: false
  params: false
  warmup: 0
  runs: 1

export:
  enabled: false
  onnx: false

experiment:
  name: yolov5_plan_smoke
  output_dir: artifacts
  seed: 42
  deterministic: true

output_path: artifacts/yolov5_plan_smoke.pt
