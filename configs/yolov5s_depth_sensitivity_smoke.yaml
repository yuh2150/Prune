# Same procedure as the practical config, but 5 COCO images and two probes only.
# Use only to validate that local data, model loading, and structural removal work.
model:
  name: yolov5
  weights: weights/yolov5s.pt
  device: cuda
  input_shape: [1, 3, 640, 640]

pruning:
  pruner: depth
  criterion: l1
  granularity: layer
  amount: 0.20

sensitivity:
  enabled: true
  max_allowed_relative_drop: 0.05

evaluation:
  enabled: true
  callback: experiments.yolov5:evaluate
  metric: map50_95
  kwargs:
    data: data/coco_5.yaml
    batch_size: 1
    imgsz: 640

benchmark:
  enabled: true
  latency: true
  flops: true
  params: true
  warmup: 2
  runs: 5

experiment:
  name: yolov5s_depth_sensitivity_smoke
  output_dir: artifacts
  seed: 42
  deterministic: true

output_path: artifacts/yolov5s_depth_sensitivity_smoke_pruned.pt
