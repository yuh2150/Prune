# Fast local smoke experiment only. It splits the supplied ImageNet validation
# subset into 900 train / 100 holdout images; do not compare its accuracy with
# an ImageNet validation benchmark.
model: {name: resnet18, weights: DEFAULT, device: cuda, input_shape: [1, 3, 224, 224], num_classes: 1000}
dataset:
  name: imagenet1k_subset
  train_root: datasets/imagenet1k_train_from_val
  root: datasets/imagenet1k_val_holdout
  batch_size: 64
  num_workers: 4
pruning:
  method: structured
  criterion: taylor
  structure: filter
  target_ratio: 0.10
  global_pruning: false
  min_channels: 8
  calibration_callback: experiments.classification:calibrate
  calibration_batches: 4
  calibration_batch_size: 64
  calibration_seed: 42
sensitivity:
  enabled: true
  rates: [0.05, 0.10]
  selector: sensitivity
  max_allowed_relative_drop: 0.05
  metric_direction: higher_is_better
evaluation: {enabled: true, callback: experiments.classification:evaluate, metric: accuracy}
recovery:
  enabled: true
  epochs: 5
  callback: experiments.classification:recover
  optimizer: {name: sgd, lr: 0.0001, momentum: 0.9, weight_decay: 0.0001}
benchmark: {enabled: true, latency: true, flops: true, params: true, warmup: 20, runs: 100}
export: {enabled: false}
experiment: {name: resnet18_valsplit_smoke_taylor_sensitivity_finetune, output_dir: artifacts, seed: 42, deterministic: true}
output_path: artifacts/resnet18_valsplit_smoke_taylor_sensitivity_finetune.pt
