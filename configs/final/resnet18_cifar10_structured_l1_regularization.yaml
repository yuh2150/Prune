# Full flow: CIFAR-10 ResNet-18 channel slimming through BN-scale L1 regularization.
model: {name: resnet18, weights: "hf_hub:edadaltocg/resnet18_cifar10", device: cuda, input_shape: [1, 3, 32, 32], num_classes: 10}
dataset: {name: cifar10, root: datasets/cifar10, batch_size: 64, num_workers: 2}
pruning: {method: structured, criterion: l1, structure: channel, target_ratio: 0.10, global_pruning: false, min_channels: 8}
regularization: {enabled: true, term: l1_bn_scale, strength: 0.0001, schedule: linear_warmup, warmup_steps: 100, total_steps: 1000, pruning_criterion: bn_scale}
sensitivity: {enabled: true, rates: [0.05, 0.10], selector: sensitivity, max_allowed_relative_drop: 0.05, metric_direction: higher_is_better}
evaluation: {enabled: true, callback: experiments.classification:evaluate, metric: accuracy}
recovery: {enabled: true, epochs: 1, callback: experiments.classification:recover, optimizer: {name: sgd, lr: 0.0001, momentum: 0.9, weight_decay: 0.0001}}
benchmark: {enabled: true, latency: true, flops: true, params: true, warmup: 20, runs: 100}
export: {enabled: true, onnx: true, output_path: artifacts/final/resnet18_cifar10_structured_l1_regularization.onnx, opset_version: 17}
experiment: {name: final_resnet18_cifar10_structured_l1_regularization, output_dir: artifacts, seed: 42, deterministic: true}
output_path: artifacts/final/resnet18_cifar10_structured_l1_regularization.pt
