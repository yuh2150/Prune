model:
  name: yolov5
  weights: weights/yolov5s.pt
  device: cuda

pruning:
  method: structured
  criterion: taylor
  structure: channel
  target_ratio: 0.30
  global: true
  min_channels: 8
  calibration_callback: experiments.yolov5:calibrate_taylor
  calibration_kwargs:
    data: data/coco50.yaml

sensitivity:
  enabled: true
  rates: [0.10, 0.20, 0.30, 0.40]
  selector: sensitivity
  max_allowed_relative_drop: 0.05

evaluation:
  enabled: true
  callback: experiments.yolov5:evaluate
  metric: map50_95
  kwargs:
    data: data/coco50.yaml

targets:
  parameter_reduction: 0.20
  max_map50_95_drop: 0.03

# This is a planning configuration. Enable recovery only with a real local
# train split and an intentional recovery.kwargs setup.
recovery:
  enabled: false
  epochs: 0
  callback: experiments.yolov5:recover

benchmark:
  enabled: false
  latency: false
  flops: false
  params: false
  warmup: 0
  runs: 1

export:
  enabled: false
  onnx: false
  output_path: artifacts/yolov5s_pruned.onnx

experiment:
  name: yolov5s_taylor_global_30
  output_dir: artifacts
  seed: 42
  deterministic: true

output_path: artifacts/yolov5s_taylor_global_30.pt
