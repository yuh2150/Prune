# Full-flow Taylor pruning on CIFAR-10 ResNet-18.
model: {name: resnet18, weights: "hf_hub:edadaltocg/resnet18_cifar10", device: cuda, input_shape: [1, 3, 32, 32], num_classes: 10}
dataset: {name: cifar10, root: datasets/cifar10, batch_size: 64, num_workers: 2}

pruning:
  method: structured
  criterion: taylor
  structure: filter
  target_ratio: 0.05
  global_pruning: false
  min_channels: 2
  calibration_callback: experiments.classification:calibrate
  calibration_batches: 4
  calibration_batch_size: 64

sensitivity:
  enabled: true
  rates: [0.05, 0.10]
  selector: sensitivity
  max_allowed_relative_drop: 0.05

evaluation:
  enabled: true
  callback: experiments.classification:evaluate
  metric: accuracy

recovery:
  enabled: true
  epochs: 1
  callback: experiments.classification:recover
  optimizer: {name: sgd, lr: 0.0001, momentum: 0.9, weight_decay: 0.0001}

benchmark:
  enabled: true
  latency: true
  flops: true
  params: true
  warmup: 10
  runs: 30

export:
  enabled: true
  onnx: true
  output_path: artifacts/resnet18_cifar10_taylor_05.onnx
  opset_version: 17

experiment:
  name: resnet18_cifar10_taylor_05
  output_dir: artifacts

output_path: artifacts/resnet18_cifar10_taylor_05.pt
