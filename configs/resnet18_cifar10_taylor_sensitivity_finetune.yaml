model: {name: resnet18_cifar10, weights: 'hf_hub:edadaltocg/resnet18_cifar10', device: cuda, input_shape: [1, 3, 32, 32], num_classes: 10}
dataset: {name: cifar10, root: datasets/cifar10, batch_size: 128, num_workers: 2}
pruning:
  method: structured
  criterion: taylor
  structure: filter
  target_ratio: 0.10
  global_pruning: false
  min_channels: 8
  calibration_callback: experiments.classification:calibrate
  calibration_batches: 8
  calibration_batch_size: 128
  calibration_seed: 42
sensitivity: {enabled: true, rates: [0.05, 0.10], selector: sensitivity, max_allowed_relative_drop: 0.01, metric_direction: higher_is_better}
evaluation: {enabled: true, callback: experiments.classification:evaluate, metric: accuracy}
recovery:
  enabled: true
  epochs: 10
  callback: experiments.classification:recover
  optimizer: {name: sgd, lr: 0.0001, momentum: 0.9, weight_decay: 0.0001}
benchmark: {enabled: true, latency: true, flops: true, params: true, warmup: 20, runs: 100}
export: {enabled: false}
experiment: {name: resnet18_cifar10_taylor_sensitivity_finetune, output_dir: artifacts, seed: 42, deterministic: true}
output_path: artifacts/resnet18_cifar10_taylor_sensitivity_finetune.pt
