model:
  name: resnet18
  weights: DEFAULT
  device: cuda
  input_shape: [1, 3, 224, 224]
  num_classes: 1000

dataset:
  name: imagenet1k_subset
  root: datasets/imagenet1k_val_1000
  batch_size: 64
  num_workers: 0

pruning:
  method: structured
  criterion: taylor
  structure: filter
  target_ratio: 0.05
  global_pruning: false
  min_channels: 2
  calibration_callback: experiments.classification:calibrate
  calibration_batches: 4
  calibration_batch_size: 64

sensitivity:
  enabled: false

evaluation:
  enabled: true
  callback: experiments.classification:evaluate
  metric: accuracy

recovery:
  enabled: false

benchmark:
  enabled: true
  latency: true
  flops: true
  params: true
  warmup: 10
  runs: 30

export:
  enabled: false

experiment:
  name: resnet18_imagenet1000_taylor_05
  output_dir: artifacts

output_path: artifacts/resnet18_imagenet1000_taylor_05.pt
