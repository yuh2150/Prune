model:
  name: resnet18
  weights: "hf_hub:edadaltocg/resnet18_cifar10"
  device: cuda
  input_shape: [1, 3, 32, 32]
  num_classes: 10

dataset:
  name: cifar10
  root: datasets/cifar10
  batch_size: 128
  num_workers: 2

pruning:
  method: unstructured
  criterion: magnitude
  structure: weight
  target_ratio: 0.3

evaluation:
  enabled: true
  callback: experiments.classification:evaluate
  metric: accuracy

recovery:
  enabled: true
  epochs: 1
  callback: experiments.classification:recover
  optimizer: {name: sgd, lr: 0.0001, momentum: 0.9, weight_decay: 0.0001}

benchmark:
  enabled: true
  latency: true
  flops: false
  params: true
  warmup: 20
  runs: 100

export:
  enabled: true
  onnx: true
  output_path: artifacts/resnet18_cifar10_hf.onnx
  opset_version: 17

experiment:
  name: resnet18_cifar10_hf
  output_dir: artifacts
  seed: 42
  deterministic: true

output_path: artifacts/resnet18_cifar10_hf.pt
