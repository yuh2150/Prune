model:
  name: yolov5
  weights: yolov5s.pt
  device: cuda

pruning:
  pruner: structured
  criterion: l1
  granularity: channel
  amount: 0.3

analysis:
  sensitivity: false
  layer_selection: false

benchmark:
  enabled: true
  runs: 50
  warmup: 10

export:
  enabled: false
  format: onnx
  output_path: pruned_yolov5s.onnx

output_path: pruned_yolov5s.pt
