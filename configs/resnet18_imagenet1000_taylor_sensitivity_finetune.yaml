# ResNet-18: Taylor sensitivity-guided structured pruning followed by fine-tuning.
#
# Dataset layout is a manifest dataset generated by tools/download_imagenet_val_subset.py:
#   datasets/imagenet1k_train_subset/manifest.json  (training images)
#   datasets/imagenet1k_val_1000/manifest.json      (validation images)
# The two manifests must use ImageNet-1K labels (0--999).
model:
  name: resnet18
  weights: DEFAULT
  device: cuda
  input_shape: [1, 3, 224, 224]
  num_classes: 1000

dataset:
  name: imagenet1k_subset
  train_root: datasets/imagenet1k_train_subset
  root: datasets/imagenet1k_val_1000
  # Safe starting point for an RTX 5060 Ti 16 GB without mixed precision.
  batch_size: 128
  num_workers: 4

pruning:
  method: structured
  criterion: taylor
  structure: filter
  # The selector assigns a ratio to each layer after its sensitivity probes;
  # this is the maximum ratio it may choose for one layer.
  target_ratio: 0.20
  global_pruning: false
  min_channels: 8
  calibration_callback: experiments.classification:calibrate
  calibration_batches: 8
  calibration_batch_size: 128
  calibration_seed: 42

sensitivity:
  enabled: true
  # Four points give a useful curve while keeping this feasible on one GPU.
  rates: [0.05, 0.10, 0.15, 0.20]
  selector: sensitivity
  max_allowed_relative_drop: 0.03
  metric_direction: higher_is_better

evaluation:
  enabled: true
  callback: experiments.classification:evaluate
  metric: accuracy

# Fine-tuning happens automatically after the selected pruning plan is applied.
recovery:
  enabled: true
  epochs: 15
  callback: experiments.classification:recover
  optimizer:
    name: sgd
    lr: 0.003
    momentum: 0.9
    weight_decay: 0.0001

benchmark:
  enabled: true
  latency: true
  flops: true
  params: true
  warmup: 20
  runs: 100

export:
  enabled: false

experiment:
  name: resnet18_imagenet1000_taylor_sensitivity_finetune_20
  output_dir: artifacts
  seed: 42
  deterministic: true

output_path: artifacts/resnet18_imagenet1000_taylor_sensitivity_finetune_20.pt
