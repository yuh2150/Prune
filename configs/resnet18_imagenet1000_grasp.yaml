# Pretrained diagnostic: keep checkpoint and protected fc head, no recovery.
# Requires local ImageNet manifest dataset; no automatic dataset download.
model: {name: resnet18, weights: DEFAULT, device: cpu, input_shape: [1, 3, 224, 224], num_classes: 1000}
dataset: {name: imagenet1k_subset, root: datasets/imagenet1k_val_1000, batch_size: 64, num_workers: 0}
pruning:
  method: unstructured
  criterion: grasp
  parameter_scope: weights
  structure: weight
  target_ratio: 0.10
  global_pruning: true
  calibration_callback: experiments.classification:calibrate
  calibration_batches: 4
  calibration_batch_size: 64
  calibration_kwargs: {temperature: 200, microbatch_size: 20}
sensitivity: {enabled: false}
evaluation: {enabled: true, callback: experiments.classification:evaluate, metric: accuracy}
recovery: {enabled: false, epochs: 0}
benchmark: {enabled: true, latency: true, flops: false, params: true, warmup: 10, runs: 30}
export: {enabled: false, onnx: false}
experiment: {name: resnet18_imagenet1000_grasp_10, output_dir: artifacts, seed: 42, deterministic: true}
output_path: artifacts/resnet18_imagenet1000_grasp_10.pt
